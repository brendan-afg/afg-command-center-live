<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <title>AFG Command Center</title>
  <link rel="icon" href="./afg-logo.jpeg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="unlock" class="unlock-shell">
    <div class="unlock-card">
      <img src="./afg-logo.jpeg" alt="AltFunds Global" />
      <p class="eyebrow">PRIVATE</p>
      <h1>AFG Command Center</h1>
      <p class="muted">Use the private AFG link or enter the access key.</p>
      <form id="unlock-form">
        <label for="access-key">Access key</label>
        <input id="access-key" type="password" autocomplete="off" spellcheck="false" placeholder="Enter access key" required />
        <button type="submit">Open dashboard</button>
      </form>
      <p id="unlock-error" class="error" role="alert"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <img src="./afg-logo.jpeg" alt="AltFunds Global" class="brand" />
      <nav id="nav" aria-label="Dashboard navigation">
        <button class="nav-item active" data-view="command">Today</button>
        <button class="nav-item" data-view="pipeline">All Files</button>
        <button class="nav-item" data-view="intelligence">All Decisions</button>
        <button class="nav-item" data-view="sources">Data Sources</button>
      </nav>
      <div class="sidebar-footer">Last updated<br><span id="side-time">—</span></div>
    </aside>

    <main>
      <header>
        <div>
          <p class="eyebrow">ALTFUNDS GLOBAL</p>
          <h1 id="page-title">Today</h1>
          <p id="page-subtitle" class="muted">Start here. These files need a decision.</p>
        </div>
        <div id="freshness" class="health-pill">Loading</div>
      </header>

      <section id="command" class="view active-view">
        <div id="source-banner" class="source-banner"></div>
        <section class="panel start-panel">
          <div class="panel-head">
            <div><p class="eyebrow">START HERE</p><h2>Files that need your decision</h2></div>
            <button id="decision-count-note" class="badge" data-view="intelligence">See all</button>
          </div>
          <div id="priority-list" class="priority-list"></div>
        </section>
        <div id="metric-grid" class="metric-grid"></div>
      </section>

      <section id="pipeline" class="view">
        <div class="toolbar">
          <input id="deal-search" type="search" placeholder="Search files" aria-label="Search files" />
          <select id="status-filter" aria-label="Filter files">
            <option value="all">All files</option>
            <option value="active">Has documents</option>
            <option value="intake_only">New file</option>
            <option value="needs_review">Needs a decision</option>
            <option value="funded">Marked funded</option>
            <option value="closed">Marked closed</option>
          </select>
        </div>
        <div id="deal-list" class="deal-list"></div>
      </section>

      <section id="intelligence" class="view">
        <div class="source-banner simple-banner"><strong>Open a file, decide what is true, and record the result.</strong></div>
        <div id="intelligence-list" class="intelligence-list"></div>
      </section>

      <section id="sources" class="view">
        <div id="source-health" class="source-health-grid"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Mobile dashboard navigation">
      <button class="active" data-view="command">Today</button>
      <button data-view="pipeline">Files</button>
      <button data-view="intelligence">Decisions</button>
      <button data-view="sources">Sources</button>
    </nav>
  </div>

  <dialog id="detail-dialog"><button id="dialog-close" class="dialog-close">Close</button><div id="dialog-content"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
